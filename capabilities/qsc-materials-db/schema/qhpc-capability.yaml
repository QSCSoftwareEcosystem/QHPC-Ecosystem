    runtime_status: not-applicable
    validation_status: contract-valid
    evidence: []
  visibility: public
  maturity: prototype
spec:
  component:
    name: QSC Materials Repository
    description: Immutable DataSchema release of QSC materials reference data and its authoritative schema.
  guidance:
    use_when:
      - Inspect the released KCuF3 Hamiltonian records and neutron-scattering dataset.
      - Validate the released records against the pinned spin-Hamiltonian schema and manifest.
    quick_start:
      - Open the release README and manifest to understand the immutable v0.1.0 snapshot.
      - Use the YAML record as the canonical representation and the JSON record as its derived representation.
      - Download from the public tagged release or an optional configured object-storage mirror.
    example_workflows: []
    limitations:
      - Object storage is optional; the tagged public release remains usable without it.
      - No executable operation is published for this component.
