api_version: qhpc/v1
kind: Capability
metadata:
  id: qsc-materials-db-schema
  name: QSC Materials Schema
  version: 0.1.0
  project: data-schema
  owners: [qsc-materials-db]
  repository:
    url: https://code.ornl.gov/intersect/data/deployments
    revision: 51373be831a94cc06c669346ca5d1fccc3a6ed76
  integration:
    authority: ecosystem
    maintainers: [qhpc-ecosystem]
    project_reviewed: false
    runtime_status: not-applicable
    validation_status: contract-valid
    evidence:
      - docs/evidence/sdl-qsc-materials-schema-admission-2026-08-28.md
  visibility: internal
  maturity: prototype
spec:
  component:
    name: QSC Materials Repository
    description: Static SDL-backed materials-db schema and provenance record for QSC materials reference artifacts.
  guidance:
    use_when:
      - Inspect the initial materials-db entity, activity, result, storage, and provenance shape before a live SDL data-service interface is admitted.
      - Trace the KCuF3 Hamiltonian and neutron-scattering seed data back to the pinned SDL deployment and schema sources.
    quick_start:
      - Open the static materials schema and provenance resources from the Data workspace.
      - Treat the KCuF3 payloads as seed reference data, not as generated QHPC workflow artifacts.
      - Use the published SDL source revisions when discussing changes to the future live materials-db service.
    example_workflows: []
    limitations:
      - This capability is a static admission record; it does not call MinIO, Fuseki, workspace-service, or another SDL runtime.
      - The current static schema mirrors the QSC data README phase-1 model and is not yet a generated dedicated materials LinkML module.
      - No executable operation is published for this component.
  resources:
    - id: materials-schema-v0.1
      kind: schema
      version: 0.1.0
      uri: data-services/qsc-materials-db/materials-schema-v0.1.yaml
      description: Static QHPC view of the SDL/QSC phase-1 materials model.
    - id: materials-provenance-v0.1
      kind: provenance
      version: 0.1.0
      uri: data-services/qsc-materials-db/provenance-v0.1.yaml
      description: Pinned source, schema, seed data, and storage-prefix provenance for the static materials-db record.
    - id: qsc-materials-db-service
      kind: data-service
      version: 0.1.0
      uri: https://code.ornl.gov/intersect/data/deployments/-/blob/51373be831a94cc06c669346ca5d1fccc3a6ed76/QSC/data/repositories.json
      description: SDL QSC repository declaration for qsc-materials-db, including draft status and qsc-data/materials-db storage mapping.
    - id: kcuf3-hamiltonian
      kind: dataset
      version: 0.1.0
      uri: https://code.ornl.gov/intersect/data/deployments/-/blob/51373be831a94cc06c669346ca5d1fccc3a6ed76/QSC/data/materials-db/example-json/KCuF3_Hamiltonian.json
      description: First structured KCuF3 spin-Hamiltonian JSON seed payload.
    - id: kcuf3-neutron-sqw
      kind: dataset
      version: 0.1.0
      uri: https://code.ornl.gov/intersect/data/deployments/-/tree/51373be831a94cc06c669346ca5d1fccc3a6ed76/QSC/data/materials-db
      description: KCuF3 neutron scattering SQW source bundle and associated provenance notes.
    - id: sdl-linkml-root
      kind: schema
      version: 0.1.0
      uri: https://code.ornl.gov/intersect/data/sdl-schema/-/blob/66399f74a2419dc650ad1d8ba1036ed5d05464c3/schemas/sdl.yaml
      description: Root SDL LinkML schema used as the vocabulary foundation for future generated material-domain models.
  documentation:
    qappswiki: docs/qsc-integration.md
    url: https://code.ornl.gov/intersect/data/deployments/-/blob/51373be831a94cc06c669346ca5d1fccc3a6ed76/QSC/data/README.md
