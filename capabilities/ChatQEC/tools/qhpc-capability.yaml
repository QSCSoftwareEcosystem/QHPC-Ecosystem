api_version: qhpc/v1
kind: Capability
metadata:
  id: chatqec-qec-tools
  name: ChatQEC Governed QEC Tools
  version: 0.1.0
  project: agentic-software
  owners: [chatqec]
  repository:
    url: https://github.com/QSCSoftwareEcosystem/chatqec-mcp-tools
    revision: dd19a85b08637a61dc1afc124d2f4b32745b527b
  integration:
    authority: ecosystem
    maintainers: [qhpc-ecosystem]
    project_reviewed: false
    runtime_status: verified
    validation_status: integration-tested
    evidence:
      - docs/evidence/chatqec-mcp-tools-inventory-2026-09-11.md
      - docs/evidence/chatqec-code-params-oci-smoke-2026-09-14.md
  visibility: internal
  maturity: pre-alpha
spec:
  component:
    name: ChatQEC MCP Tools
    description: Pinned QEC calculations from the ChatQEC tool repository, executed only as bounded EQO operations rather than MCP subprocesses.
  guidance:
    use_when:
      - Compute bounded QEC code parameters, PyMatching decoder results, LightStim-built code circuits, threshold-sweep evidence, and shareable GLCB visualization links with exact source and runtime provenance.
    quick_start:
      - In Compose, choose a ChatQEC governed QEC operation.
      - Review the bounded parameters and input artifact, then submit to a compatible worker.
    example_workflows:
      - chatqec-code-parameters
      - chatqec-qec-toolchain
      - chatqec-threshold-sweep
      - chatqec-tsim-simulation
      - chatqec-glcb-link
    limitations:
      - Code-parameter calculation, PyMatching decoding, LightStim circuit construction, threshold sweeps, and GLCB link generation have local OCI smoke evidence; candidate images remain unpublished.
      - Direct Stim and Tsim simulation are separately published EQO capabilities that currently reuse their validated ChatQEC wrappers.
      - ChatQEC may propose a calculation, including an independently published Stim or Tsim operation, but an EQO user must review and confirm it before any run is submitted.
      - The candidate OCI image is unpublished and is not accepted for an HPC target.
  operations:
    - id: code-params
      title: Report QEC code parameters
      description: Return [[n,k]], stabilizer count, detector and observable counts, and Stim graphlike-distance evidence for a bounded supported code family.
      inputs: {}
      outputs:
        parameters:
          artifact_type: qhpc.qec-code-parameters@1
      parameters:
        code_family:
          type: string
          title: Code family
          default: surface_code_rotated
          enum: [surface_code_rotated, repetition_code, color_code]
        distance:
          type: integer
          title: Code distance
          default: 3
          minimum: 3
          maximum: 15
      runtime:
        type: oci
        reference: docker://qhpc/chatqec-qec-tools@sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
        digest: sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-chatqec-qec-tools, code-params]
      resources:
        cpu: 1
        memory_mb: 512
        walltime_seconds: 60
      execution_targets: [development-slurm-docker]
    - id: pymatching-decode
      title: Decode a detector-annotated Stim circuit
      description: Decode bounded Stim detector samples with PyMatching and report the sampled logical-error rate and exact error count.
      inputs:
        circuit:
          artifact_type: qhpc.stim-circuit@1
      outputs:
        result:
          artifact_type: qhpc.qec-decoder-result@1
      parameters:
        shots:
          type: integer
          title: Decoder shots
          default: 1024
          minimum: 1
          maximum: 1000000
      runtime:
        type: oci
        reference: docker://qhpc/chatqec-qec-tools@sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
        digest: sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-chatqec-qec-tools, pymatching-decode]
      resources:
        cpu: 1
        memory_mb: 2048
        walltime_seconds: 60
      execution_targets: [development-slurm-docker]
    - id: threshold-sweep
      title: Sweep physical error rates across code distances
      description: Generate and PyMatching-decode bounded Stim memory experiments, returning empirical logical-error rows and a sanitized logarithmic SVG plot. This is sweep evidence, not an inferred threshold claim.
      inputs: {}
      outputs:
        results:
          artifact_type: qhpc.qec-threshold-sweep@1
        plot:
          artifact_type: qhpc.qec-threshold-plot@1
      parameters:
        code_family:
          type: string
          title: Code family
          default: surface_code_rotated
          enum: [surface_code_rotated, repetition_code, color_code]
        distances:
          type: string
          title: Comma-separated code distances
          default: "3,5"
        p_values:
          type: string
          title: Comma-separated physical error rates
          default: "0.001,0.01"
        rounds:
          type: integer
          title: Syndrome-extraction rounds (zero uses the code distance)
          default: 0
          minimum: 0
          maximum: 200
        shots:
          type: integer
          title: Decoder shots per distance/error-rate point
          default: 200
          minimum: 1
          maximum: 1000000
      runtime:
        type: oci
        reference: docker://qhpc/chatqec-qec-tools@sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
        digest: sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-chatqec-qec-tools, threshold-sweep]
      resources:
        cpu: 2
        memory_mb: 4096
        walltime_seconds: 600
      execution_targets: [development-slurm-docker]
    - id: qec-circuit-build
      title: Build a QEC circuit with LightStim
      description: Construct a bounded detector-annotated Stim circuit for a LightStim-supported QEC family, preserving its build report and exact pinned LightStim source revision.
      inputs: {}
      outputs:
        circuit:
          artifact_type: qhpc.stim-circuit@1
        report:
          artifact_type: qhpc.qec-circuit-build-report@1
      parameters:
        code_family:
          type: string
          title: QEC code family
          default: toric_code
          enum: [toric_code, color_code_666, bb_code, pqrm]
        distance:
          type: integer
          title: Code distance
          default: 3
          minimum: 3
          maximum: 15
        rounds:
          type: integer
          title: Memory syndrome-extraction rounds
          default: 3
          minimum: 1
          maximum: 200
        protocol:
          type: string
          title: Protocol
          default: memory
          enum: [memory]
      runtime:
        type: oci
        reference: docker://qhpc/chatqec-lightstim@sha256:433d7e9c8520c9858f0a9a5f15f4a8c84acb14c74d514f83195b6db2663a1399
        digest: sha256:433d7e9c8520c9858f0a9a5f15f4a8c84acb14c74d514f83195b6db2663a1399
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-chatqec-lightstim-build]
      resources:
        cpu: 2
        memory_mb: 4096
        walltime_seconds: 120
      execution_targets: [development-slurm-docker]
    - id: glcb-visualize-url
      title: Create a Gemini Logical Circuit Builder link
      description: Create a deterministic URL for a bounded GLCB circuit specification without contacting the external service. Opening the returned link is an external circuit disclosure.
      inputs:
        circuit:
          artifact_type: qhpc.glcb-circuit-spec@1
      outputs:
        link:
          artifact_type: qhpc.glcb-visualization-link@1
      parameters: {}
      runtime:
        type: oci
        reference: docker://qhpc/chatqec-qec-tools@sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
        digest: sha256:7dc81e271909f18ba8e1f236b02627eb5145dd7c34b85c2ff55eceaf779b564a
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-chatqec-qec-tools, glcb-visualize-url]
      resources:
        cpu: 1
        memory_mb: 512
        walltime_seconds: 60
      execution_targets: [development-slurm-docker]
  resources:
    - id: tool-interface
      kind: adapter
      version: 0.1.0
