api_version: qhpc/v1
kind: Capability
metadata:
  id: qasmtrans-transpiler
  name: QASMTrans Transpiler
  version: 0.1.0
  project: compilation-tools
  owners: [qasmtrans]
  repository:
    url: https://github.com/pnnl/qasmtrans
    revision: 1843c98fa4bac9cf6b88412145b69457e9176124
  integration:
    authority: ecosystem
    maintainers: [qhpc-ecosystem]
    project_reviewed: false
    runtime_status: verified
    validation_status: integration-tested
    evidence:
      - docs/evidence/repository-audit-2026-07-11.md
      - docs/evidence/qasmtrans-oci-smoke-2026-07-27.md
  visibility: public
  maturity: alpha
spec:
  component:
    name: QASMTrans
    description: Extensible C++ quantum transpiler that maps OpenQASM circuits to device topologies and native basis gates for multiple quantum hardware families.
  guidance:
    use_when:
      - Map an OpenQASM 2.0 circuit to the audited IBM Toronto topology and basis-gate family.
    quick_start:
      - Open Compose and choose QASMTrans transpilation or Compile and analyze OpenQASM.
      - Upload an OpenQASM 2.0 circuit, review the fixed backend and mode, and run on the development Slurm Docker target.
    example_workflows:
      - qasmtrans-transpile
      - ct-hw-qasm-analysis
      - showcase-evolution-readiness
    limitations:
      - The current operation is restricted to the audited IBM Toronto topology and IBMQ basis family.
  operations:
    - id: transpile
      title: Transpile OpenQASM circuit
      description: Map an OpenQASM 2 circuit to the audited IBM Toronto topology.
      inputs:
        circuit:
          artifact_type: qhpc.quantum-circuit@1
      outputs:
        circuit:
          artifact_type: qhpc.transpiled-circuit@1
      parameters:
        mode:
          type: string
          title: Target basis-gate family
          default: ibmq
          enum: [ibmq]
        backend:
          type: string
          title: Target topology
          default: ibmq_toronto
          enum: [ibmq_toronto]
      runtime:
        type: oci
        reference: docker://qhpc/qasmtrans@sha256:28e761efbd030c01e51edb96c7da6bafed7f18155c5b3973aa54aa030dbac9df
        digest: sha256:28e761efbd030c01e51edb96c7da6bafed7f18155c5b3973aa54aa030dbac9df
      invocation:
        entrypoint: [/opt/qhpc/bin/qhpc-qasmtrans]
      resources:
        cpu: 1
        memory_mb: 1024
        walltime_seconds: 60
      execution_targets: [development-slurm-docker]
  resources:
    - id: transpiler-source
      kind: library
      version: 0.1.0
      uri: https://github.com/pnnl/qasmtrans/tree/1843c98fa4bac9cf6b88412145b69457e9176124
  documentation:
    qappswiki: packages/qasmtrans.md
    url: https://github.com/pnnl/qasmtrans/blob/1843c98fa4bac9cf6b88412145b69457e9176124/README.md
