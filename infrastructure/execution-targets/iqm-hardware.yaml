api_version: qhpc/v1
kind: ExecutionTarget
metadata:
  id: iqm-hardware
  name: Isolated IQM hardware worker
  owners: [software-engineering]
  visibility: controlled
  status: active
  evidence:
    - docs/iqm-hardware-target.md
spec:
  runner: quantum
  execution_classes: [quantum-backend]
  container_runtimes: []
  resource_limits:
    max_cpu: 1
    max_memory_mb: 2048
    max_gpu: 0
    max_walltime_seconds: 7200
  policies:
    approved_images_only: true
    network_access: approved-egress
    allowed_projects:
      - compilation-tools
      - hybrid-workflows
