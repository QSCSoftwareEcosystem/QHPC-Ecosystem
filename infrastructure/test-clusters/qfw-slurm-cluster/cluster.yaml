api_version: qhpc/v1
kind: SlurmTestCluster
metadata:
  id: openqse-qfw-slurm
  name: OpenQSE QFw Slurm development environment
  owners:
    - QSC Software Thrust
  contributors:
    - OpenQSE
    - Thomas Naughton
  status: validated
  evidence:
    - ../../../docs/adr/0010-openqse-qfw-slurm-provider.md
    - ../../../docs/evidence/qfw-slurm-cluster-source-audit-2026-07-28.md
    - ../../../docs/evidence/qfw-slurm-cluster-source-audit-2026-09-14.md
    - ../../../docs/evidence/qfw-slurm-office-admission-2026-09-15.intoto.json
    - ../../../docs/evidence/qfw-slurm-office-public-release-2026-09-16.md
    - ../../../docs/evidence/qfw-slurm-office-validation-2026-09-15.md
    - ../../../docs/hpc-execution.md
spec:
  scheduler: slurm
  scope: development-only
  production_evidence: false
  source:
    repository: https://github.com/openQSE/QFw-SLURM-Cluster.git
    branch: main
    revision: eeb42e601383f3d33020f823d4a387ef30b9dd7d
    license: MIT
  compatibility:
    build_ca_destination: qhpc-build-ca.pem
    image:
      local_reference: qhpc/openqse-qfw-slurm:0.1.0-office
      registry_reference: ghcr.io/qscsoftwareecosystem/eqo-qfw-slurm@sha256:5d6a15ba9338e54c4eda135381cc74d1f65e582da9fc861abfb1c0b1dd359105
      registry_index_digest: sha256:5d6a15ba9338e54c4eda135381cc74d1f65e582da9fc861abfb1c0b1dd359105
      digest: sha256:0fed63f95914df4927ea26a34296d1862821bc52629bffd5fb7869ecf612de41
      config_digest: sha256:1ee74220fa86caec44abe12993e794e9e911abef7c4ef37fdbc1e3fa6d9cd95b
      platform: linux/amd64
      dockerfile: infrastructure/test-clusters/qfw-slurm-cluster/Dockerfile.qhpc
      source_lock: infrastructure/test-clusters/qfw-slurm-cluster/source-lock.json
      sbom: docs/evidence/qfw-slurm-office-sbom-2026-09-15.spdx.json
      provenance: docs/evidence/qfw-slurm-office-provenance-2026-09-15.intoto.json
      signature: docs/evidence/qfw-slurm-office-admission-2026-09-15.sig
      public_key: docs/evidence/qfw-slurm-office-2026-09-15.ed25519.pub.pem
      license_inventory: docs/evidence/qfw-slurm-office-license-inventory-2026-09-15.md
      validation: docs/evidence/qfw-slurm-office-validation-2026-09-15.md
    files:
      - source: compose.qhpc.yaml
        destination: compose.qhpc.yaml
      - source: Dockerfile.qhpc
        destination: Dockerfile.qhpc
      - source: Dockerfile.qhpc.dockerignore
        destination: Dockerfile.qhpc.dockerignore
      - source: build-compatibility-image.sh
        destination: build-compatibility-image.sh
      - source: docker-entrypoint.qhpc.sh
        destination: docker-entrypoint.qhpc.sh
      - source: qfw-dependency-pins.patch
        destination: qfw-dependency-pins.patch
      - source: requirements.qhpc.lock
        destination: requirements.qhpc.lock
      - source: requirements.qhpc-build.lock
        destination: requirements.qhpc-build.lock
      - source: rpm.qhpc.lock
        destination: rpm.qhpc.lock
      - source: source-lock.json
        destination: source-lock.json
  compose:
    project_name: qhpc-openqse-qfw-test
    compose_file: compose.qhpc.yaml
    overrides: []
    services:
      - mysql
      - slurmdbd
      - slurmctld
      - c1
      - c2
      - c3
      - c4
      - c5
      - c6
      - c7
      - c8
    controller_service: slurmctld
    worker_services:
      - c1
      - c2
      - c3
      - c4
      - c5
      - c6
      - c7
      - c8
    cluster_name: linux
    partition: normal
    shared_directory:
      host: shared-dir
      container: /mnt
    readiness_timeout_seconds: 900
    poll_interval_seconds: 2
  security:
    start_rest_api: false
    default_credentials: false
    isolated_test_data_only: true
    secret_files:
      munge_key: qhpc-secrets/munge-key
      jwt_key: qhpc-secrets/slurm-jwt-key
      database_password: qhpc-secrets/slurm-db-password
  limitations:
    - Validated Tier 1C project-stack provider for isolated office development simulation only; it is not facility-HPC performance evidence.
    - This provider complements the lightweight scheduler-conformance cluster and does not replace it.
    - The upstream source starts slurmrestd by default; QHPC excludes that service and does not accept its REST security settings.
    - QHPC uses a separate pinned compatibility Dockerfile with TLS verification, immutable source and package locks, an SPDX SBOM, SLSA provenance, and a locally verifiable admission signature; it does not approve the upstream Dockerfile or published image.
    - No slurmrestd service, host-published endpoint, SSH daemon, shared root SSH, or default database credential is enabled in the QHPC stack.
    - Synthetic QPU resources and task/none isolation are development-only.
    - Real IQM or other device credentials must not be passed through shell history, Compose files, images, or committed environment files.
    - Apptainer, accepted operation SIFs, facility identity, parallel storage, RDMA hardware, GPUs, and production security are not validated.
    - MPI and libfabric behavior inside one Docker host is not representative of a facility interconnect.
    - Slurm-PMIx is not included in this compatibility image; Open MPI works for local container checks, while cross-node Open MPI/OSU latency under `srun` is not validated.
    - The stack is not an ecosystem-wide runtime and cannot bypass project operation and target-adapter contracts.
