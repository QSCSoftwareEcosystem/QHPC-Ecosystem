api_version: qhpc/v1
kind: OperationRuntime
metadata:
  id: stabsim-analyze-metrics-linux-amd64
  name: STABSim metrics Linux runtime
  version: 0.1.0
  component: stabsim
  capability: stabsim-simulator
  operation: analyze-metrics
  project: hybrid-workflows
  owners: [qhpc-ecosystem]
  source:
    url: https://github.com/seangarn32/STABSim
    revision: a0d8d2e2a9fdec9785857104220b8e7f0346c761
