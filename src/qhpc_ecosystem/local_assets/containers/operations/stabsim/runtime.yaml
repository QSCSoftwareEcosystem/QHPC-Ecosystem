    network: disabled
    read_only_root: true
    mounts:
      - name: circuit-input
        kind: input
        path: /inputs
        mode: ro
      - name: metrics-output
        kind: output
        path: /outputs
        mode: rw
    ports:
      inputs:
        circuit: /inputs/circuit.qasm
      outputs:
        metrics: /outputs/metrics.json
    parameters:
      random_seed:
        argument: --random-seed
        type: integer
  verification:
    fixture:
      path: containers/operations/stabsim/fixtures/bell.qasm
      digest: sha256:7d44e21c07f288034b521edb642e70a4664d05b87b182d9d3604593e45ceee0b
      mount_path: /inputs/circuit.qasm
    arguments: [--random-seed, "42"]
    expected_outputs:
      - path: /outputs/metrics.json
        nonempty: true
        text_contains: ['"circuit_depth": 2', '"two_qubit_gates": 1']
    timeout_seconds: 60
  release:
    status: unpublished
