  evidence:
    - docs/evidence/repository-audit-2026-07-11.md
    - docs/evidence/stabsim-oci-smoke-2026-07-27.md
spec:
  packaging: oci-to-apptainer
  platform:
    os: linux
    architecture: amd64
  build:
    recipe:
      path: containers/operations/stabsim/Containerfile
      digest: sha256:4c165ec499e90aab0f9106b93c190251495215ce1ad114b2860b06260b552655
    source_archive:
      filename: source.tar
      format: git-archive-tar
      digest: sha256:760bcd2908389ea85071b743dec65ba8b1270aaf4fa7fc9e4e870fbc93c326f6
      source_date_epoch: 1779411961
    context_files:
      - source: containers/operations/stabsim/entrypoint.sh
        destination: entrypoint.sh
        digest: sha256:7d0e8c4af49e74760934db05ea71494768b485e2ce5d199fe5ef45b299ec2ca4
        mode: "0755"
    builder:
      reference: docker.io/library/gcc:13.4.0-bookworm@sha256:69004890c1c5fa2deb855aecc4033afa507c5d187b89e2bce4eb1d907101e867
      digest: sha256:69004890c1c5fa2deb855aecc4033afa507c5d187b89e2bce4eb1d907101e867
    runtime_base:
      reference: docker.io/library/debian:bookworm-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e
      digest: sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e
    network: disabled
  execution:
    entrypoint: [/opt/qhpc/bin/qhpc-stabsim-metrics]
