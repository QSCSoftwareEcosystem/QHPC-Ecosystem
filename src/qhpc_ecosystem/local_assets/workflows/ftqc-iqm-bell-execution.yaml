api_version: qhpc/v1
kind: Workflow
metadata:
  id: ftqc-iqm-bell-execution
  name: Route and execute a two-device-qubit Bell circuit on IQM
  version: 0.2.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Prepare a measured two-device-qubit Bell circuit, then route and submit it only through an admitted IQM quantum-backend worker.
spec:
  nodes:
    - id: prepare
      operation:
        capability: ftqc-compiler
        version: 0.4.0
        operation: prepare-iqm
      parameters:
        preparation: device
        function_name: bell
      execution_target: local-development
      execution_class: interactive-local
    - id: execute
      operation:
        capability: ftqc-compiler
        version: 0.4.0
        operation: route-submit-collect
      parameters:
        device_alias: default
        shots: 512
        credential_reference: secret://env/IQM_TOKEN
        max_wait_seconds: 1800
      execution_target: local-development
      execution_class: quantum-backend
  edges:
    - from:
        node: prepare
        port: circuit
        artifact_type: qhpc.iqm-circuit@1
      to:
        node: execute
        port: circuit
        artifact_type: qhpc.iqm-circuit@1
    - from:
        node: prepare
        port: report
        artifact_type: qhpc.ftqc-iqm-preparation-report@1
      to:
        node: execute
        port: report
        artifact_type: qhpc.ftqc-iqm-preparation-report@1
  inputs:
    circuit:
      artifact_type: qhpc.quantum-circuit@1
      to:
        node: prepare
        port: circuit
  outputs:
    program:
      artifact_type: qhpc.ftqc-mlir@1
      from:
        node: prepare
        port: program
    iqm_circuit:
      artifact_type: qhpc.iqm-circuit@1
      from:
        node: prepare
        port: circuit
    preparation_report:
      artifact_type: qhpc.ftqc-iqm-preparation-report@1
      from:
        node: prepare
        port: report
    routed_layout:
      artifact_type: qhpc.iqm-routed-layout@1
      from:
        node: execute
        port: layout
    job_receipt:
      artifact_type: qhpc.iqm-job-receipt@1
      from:
        node: execute
        port: receipt
    raw_counts:
      artifact_type: qhpc.iqm-raw-counts@1
      from:
        node: execute
        port: counts
    logical_result:
      artifact_type: qhpc.ftqc-logical-result@1
      from:
        node: execute
        port: logical_result
