api_version: qhpc/v1
kind: Workflow
metadata:
  id: openqevo-nwqsim-tour
  name: OpenQEvo to NWQ-Sim CPU tour
  version: 0.1.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Synthesize a bounded OpenQEvo Trotter circuit and simulate the exact resulting OpenQASM artifact with the development-only NWQ-Sim CPU operation.
spec:
  nodes:
    - id: synthesize
      operation:
        capability: openqevo-library
        version: 0.1.0
        operation: synthesize-evolution
      execution_target: local-development
      execution_class: interactive-local
      parameters:
        method: qiskit_trotter
        evolution_time: 1.0
        steps: 4
        order: 2
    - id: simulate
      operation:
        capability: nwqsim-cpu-simulation
        version: 0.1.0
        operation: simulate-qasm
      execution_target: local-development
      execution_class: interactive-local
      parameters:
        shots: 1024
        random_seed: 42
        max_qubits: 16
  edges:
    - from:
        node: synthesize
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
      to:
        node: simulate
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
  inputs:
    hamiltonian:
      artifact_type: qhpc.pauli-hamiltonian@1
      required: true
      to:
        node: synthesize
        port: hamiltonian
  outputs:
    circuit:
      artifact_type: qhpc.quantum-circuit@1
      from:
        node: synthesize
        port: circuit
    synthesis_report:
      artifact_type: qhpc.evolution-synthesis-report@1
      from:
        node: synthesize
        port: report
    measurements:
      artifact_type: qhpc.nwqsim-measurement-counts@1
      from:
        node: simulate
        port: measurements
