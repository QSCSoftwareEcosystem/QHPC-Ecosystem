          name: Stim
          description: Direct, bounded Stim circuit simulation and non-active SVG diagram rendering, delivered
            temporarily through the validated ChatQEC QEC-tools wrapper.
        guidance:
          use_when:
          - Simulate a typed Stim circuit or render its circuit timeline in an EQO run or workflow.
          quick_start:
