              default: 3
              minimum: 1
              maximum: 31
            z_distance:
              type: integer
              title: Z code distance
              default: 3
              minimum: 1
              maximum: 31
            rounds:
              type: integer
              title: Syndrome extraction rounds
              default: 3
              minimum: 1
              maximum: 100
            measurement_basis:
              type: string
              title: Logical measurement basis
              default: Z
              enum:
              - X
              - Z
            physical_error_rate:
              type: number
              title: Physical error rate
              default: 0.001
              minimum: 0
              maximum: 0.5
          runtime:
            type: oci
            reference: docker://qhpc/ftprimitivebench@sha256:a5d08a83224df9e9dc7d063c16ee44afdbe09f5aa33710e2b39bc6b35b163dc3
