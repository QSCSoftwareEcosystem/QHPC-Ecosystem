          uri: https://github.com/QSCSoftwareEcosystem/FTQC/tree/779216de8805ea0c1d473c640eaf17d6cbfa04e8
          description: Pinned private source containing the C API, IQM JSON lowering, physical Steane
            expansion, routing/submission path, and demonstration fixtures.
        - id: developer-attribution
          kind: documentation
          version: 1.0.0
          uri: docs/tool-attribution.md#ftqc
        documentation:
          qappswiki: packages/ftqc.md
          url: https://github.com/QSCSoftwareEcosystem/FTQC/blob/779216de8805ea0c1d473c640eaf17d6cbfa04e8/README.md
        operations:
        - id: prepare-iqm
          title: Prepare an IQM-native circuit
          description: Compile OpenQASM through the pinned FTQC C API and emit logical MLIR, IQM JSON,
            and an explicit no-routing/no-submission report.
          inputs:
            circuit:
              artifact_type: qhpc.quantum-circuit@1
              description: UTF-8 OpenQASM 2.0 or 3.0 source for one admitted demonstration shape.
          outputs:
            program:
              artifact_type: qhpc.ftqc-mlir@1
              description: FTQC logical MLIR with the generated IQM JSON module attribute.
            circuit:
              artifact_type: qhpc.iqm-circuit@1
              description: IQM-native prx, cz, and measure instructions in radians; not routed against
                live calibration.
            report:
              artifact_type: qhpc.ftqc-iqm-preparation-report@1
              description: Compiler provenance, widths, gate counts, and routing/submission claim boundaries.
          parameters:
            preparation:
              type: string
              title: Preparation boundary
              default: device
              enum:
              - device
              - steane-logical
            function_name:
              type: string
              title: MLIR and IQM circuit name
              default: circuit
          runtime:
            type: oci
            reference: docker://qhpc/ftqc@sha256:710cac493de63ca727a38ba55bbf80329511f16295951312e618732189dd51ac
            digest: sha256:710cac493de63ca727a38ba55bbf80329511f16295951312e618732189dd51ac
          invocation:
            entrypoint:
            - qhpc-ftqc-prepare-iqm
          resources:
            cpu: 1
            memory_mb: 2048
            walltime_seconds: 120
          execution_targets:
          - local-development
        - id: route-submit-collect
          title: Route and execute a prepared circuit on IQM
          description: Resolve a worker-local credential, route against an exact device calibration, submit
            and poll one bounded IQM job, then preserve its layout, receipt, raw counts, and logical readout.
          inputs:
            circuit:
              artifact_type: qhpc.iqm-circuit@1
              description: Credential-free IQM-native circuit emitted by the preparation stage.
            report:
              artifact_type: qhpc.ftqc-iqm-preparation-report@1
