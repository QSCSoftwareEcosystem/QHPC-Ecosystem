      spec:
        component:
          name: ChatQEC
          description: Quantum error-correction research assistant with cited retrieval over a curated
            corpus that can propose independently published, bounded EQO simulator operations for user-confirmed
            execution.
        guidance:
          use_when:
          - Ask QEC questions while retaining the current EQO-QSC workspace context and source citations.
          quick_start:
          - Open Assistant or the contextual ChatQEC panel.
          - Ask a focused QEC question and inspect the cited sources in the response.
          example_workflows: []
          service_modes:
          - 'mcp-direct-tools: proposes explicitly supplied bounded circuits for the published Stim or
            Tsim EQO capability; EQO executes only after user confirmation and records the completed run.'
          - 'canonical-corpus-extractive-fallback: serves the deterministic bundled corpus read-only when
            direct tools are not active.'
        resources:
        - id: service-interface
          kind: adapter
          version: 0.1.0
          uri: integrations/chatqec/service.yaml
        - id: chatqec-source
          kind: library
          version: 0.1.1
          uri: https://github.com/QSCSoftwareEcosystem/ChatQEC/tree/a1ddc2e4916b1f4152fba4c94c9c7512eea0d977
