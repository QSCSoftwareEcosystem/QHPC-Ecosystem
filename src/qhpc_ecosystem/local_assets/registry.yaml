            credential_reference:
              type: string
              title: Worker-local secret reference
              default: secret://env/IQM_TOKEN
            max_wait_seconds:
              type: integer
              title: Maximum backend wait
              default: 1800
              minimum: 30
              maximum: 7200
          runtime:
            type: python-wheel
            reference: qhpc-runtime://wheels/qhpc_ecosystem-0.1.0-py3-none-any.whl
            digest: sha256:718119bf215316c3b09c825203a30c2f9868490302f36f5e6fba303244f45413
          invocation:
            entrypoint:
            - qhpc-iqm-worker
          resources:
            cpu: 1
            memory_mb: 2048
            walltime_seconds: 7200
          execution_targets:
          - local-development
