name: EQO Local release gates

on:
  push:
    branches: [main, dev-local]
  pull_request:
    branches: [main, dev-local]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit Workbench dependency graph
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=./workbench/frontend/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
      runs-on: ubuntu-24.04

  portable-release:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - name: Install release-build dependencies
        run: python -m pip install --upgrade pip setuptools wheel '.[dev,local]'
      - name: Build and verify release candidate
        run: python tools/build_local_release.py
      - name: Verify installed lifecycle outside the checkout
        run: python tools/verify_installed_local_release.py dist/qhpc_ecosystem-0.1.0-py3-none-any.whl
      - name: Verify release checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: eqo-local-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/qhpc_ecosystem-*.whl
            dist/SHA256SUMS
            dist/EQO_LOCAL_SOFTWARE_INVENTORY.json

  portable-state-export:
    name: Export populated state on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install portable-state dependencies
        run: python -m pip install --upgrade pip '.[local]'
      - name: Export populated portable state
        run: python tools/verify_cross_platform_bundle.py export dist/cross-platform-state.eqo
      - uses: actions/upload-artifact@v7
        with:
          name: eqo-cross-platform-state
          path: dist/cross-platform-state.eqo

  portable-state-import:
    name: Import Linux state on macOS
    needs: portable-state-export
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install portable-state dependencies
        run: python -m pip install --upgrade pip '.[local]'
      - uses: actions/download-artifact@v8
        with:
          name: eqo-cross-platform-state
          path: dist
      - name: Import and verify Linux portable state
        run: python tools/verify_cross_platform_bundle.py import dist/cross-platform-state.eqo
