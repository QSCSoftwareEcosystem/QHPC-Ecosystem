<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">QHPC-Ecosystem</title>
  <desc id="description">Quantum Science Center integration layer for scientific software, capabilities, and reproducible quantum-HPC execution.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.53" stop-color="#111d30"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b41d39"/>
      <stop offset="0.5" stop-color="#56d7e8"/>
      <stop offset="1" stop-color="#b582f8"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#1c3553" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#12304a" stop-opacity=".36"/>
      <stop offset="1" stop-color="#0a1727" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8eacd0" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#surface)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <circle cx="1235" cy="304" r="352" fill="url(#field)"/>
  <path d="M0 511C268 426 445 610 720 514S1180 365 1600 466" fill="none" stroke="#507094" stroke-opacity=".22" stroke-width="1"/>
  <path d="M0 553C271 468 481 645 765 545S1220 402 1600 493" fill="none" stroke="#507094" stroke-opacity=".18" stroke-width="1"/>

  <g opacity=".8">
    <path d="M846 171H1381" fill="none" stroke="#65d4e5" stroke-opacity=".34" stroke-width="2"/>
    <path d="M925 380H1506" fill="none" stroke="#b582f8" stroke-opacity=".34" stroke-width="2"/>
    <path d="M1004 260H1453" fill="none" stroke="#c52a49" stroke-opacity=".42" stroke-width="2"/>
    <path d="M984 174L1073 260L984 380" fill="none" stroke="#65d4e5" stroke-opacity=".25" stroke-width="2"/>
    <path d="M1221 171L1308 260L1221 380" fill="none" stroke="#b582f8" stroke-opacity=".25" stroke-width="2"/>
    <path d="M1454 171L1541 260L1454 380" fill="none" stroke="#65d4e5" stroke-opacity=".25" stroke-width="2"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="984" cy="171" r="8" fill="#62dbe9"/>
    <circle cx="1073" cy="260" r="11" fill="#c52a49"/>
    <circle cx="984" cy="380" r="8" fill="#62dbe9"/>
    <circle cx="1221" cy="171" r="8" fill="#b582f8"/>
    <circle cx="1308" cy="260" r="11" fill="#62dbe9"/>
    <circle cx="1221" cy="380" r="8" fill="#b582f8"/>
    <circle cx="1454" cy="171" r="8" fill="#62dbe9"/>
    <circle cx="1541" cy="260" r="11" fill="#c52a49"/>
    <circle cx="1454" cy="380" r="8" fill="#62dbe9"/>
  </g>
  <g fill="none" stroke="#d5e5f6" stroke-opacity=".8" stroke-width="1.5">
    <path d="M1073 226l29 17v34l-29 17-29-17v-34z"/>
    <path d="M1308 222l33 19v38l-33 19-33-19v-38z"/>
    <path d="M1541 226l29 17v34l-29 17-29-17v-34z"/>
  </g>

  <image x="80" y="62" width="366" height="122" preserveAspectRatio="xMinYMid meet" xlink:href="qsc-logo-white.png" href="qsc-logo-white.png"/>
  <rect x="80" y="222" width="70" height="5" rx="2.5" fill="#c52a49"/>
  <rect x="161" y="222" width="54" height="5" rx="2.5" fill="#62dbe9"/>
  <rect x="226" y="222" width="42" height="5" rx="2.5" fill="#b582f8"/>
  <text x="80" y="316" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">QHPC-Ecosystem</text>
  <text x="82" y="365" fill="#b9c9dc" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" letter-spacing=".2">The integration layer for quantum–HPC science</text>
  <text x="82" y="406" fill="#90a8c2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Independent software · attributed capabilities · reproducible execution</text>

  <line x1="82" y1="489" x2="700" y2="489" stroke="url(#rail)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="532" fill="#74dce9" font-size="13" font-weight="700" letter-spacing="1.7">DISCOVER</text>
    <text x="82" y="561" fill="#e8eff7" font-size="19" font-weight="600">QSC scientific software</text>
    <text x="318" y="532" fill="#c69afb" font-size="13" font-weight="700" letter-spacing="1.7">GOVERN</text>
    <text x="318" y="561" fill="#e8eff7" font-size="19" font-weight="600">Pinned capabilities</text>
    <text x="541" y="532" fill="#ec6c83" font-size="13" font-weight="700" letter-spacing="1.7">EXECUTE</text>
    <text x="541" y="561" fill="#e8eff7" font-size="19" font-weight="600">Accountable HPC runs</text>
  </g>

  <text x="1460" y="579" text-anchor="end" fill="#aebfd2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="1.4">QUANTUM SCIENCE CENTER</text>
</svg>
