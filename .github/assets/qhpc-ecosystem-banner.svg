<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">QHPC-Ecosystem — Ecosystem for Quantum Orchestration</title>
  <desc id="description">A Quantum Science Center and EQO-QSC branded system overview for QHPC-Ecosystem.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020406"/>
      <stop offset=".54" stop-color="#0a131c"/>
      <stop offset="1" stop-color="#020406"/>
    </linearGradient>
    <radialGradient id="nebula" cx="84%" cy="8%" r="70%">
      <stop offset="0" stop-color="#aa1e2e" stop-opacity=".28"/>
      <stop offset=".27" stop-color="#5b0d18" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#131e29" stop-opacity=".15"/>
      <stop offset="1" stop-color="#020406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182635" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0c141c" stop-opacity=".94"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#cfd2d3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#base)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <rect width="1600" height="560" fill="url(#nebula)"/>
  <rect x="0" y="0" width="10" height="560" fill="#aa1e2e"/>
  <path d="M0 482C240 423 457 563 745 479S1206 359 1600 433" fill="none" stroke="#cfd2d3" stroke-opacity=".10" stroke-width="1"/>
  <path d="M0 518C266 458 503 579 782 510S1226 395 1600 465" fill="none" stroke="#cfd2d3" stroke-opacity=".06" stroke-width="1"/>

  <image x="80" y="52" width="330" height="110" preserveAspectRatio="xMinYMid meet" xlink:href="qsc-logo-white.png" href="qsc-logo-white.png"/>
  <text x="82" y="210" fill="#91a2af" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.9">EQO-QSC / QHPC OVERVIEW</text>
  <rect x="82" y="229" width="64" height="4" rx="2" fill="#aa1e2e"/>
  <text x="80" y="313" fill="#f2f5f6" font-family="Open Sans, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">QHPC-Ecosystem</text>
  <text x="82" y="358" fill="#cfd2d3" font-family="Open Sans, Arial, sans-serif" font-size="25" font-weight="400">Ecosystem for Quantum Orchestration</text>
  <text x="82" y="405" fill="#91a2af" font-family="Open Sans, Arial, sans-serif" font-size="17">Scientific software · admitted capabilities · accountable execution</text>
  <line x1="82" y1="455" x2="692" y2="455" stroke="#2a3846" stroke-width="1"/>
  <g font-family="Open Sans, Arial, sans-serif">
    <text x="82" y="492" fill="#8293a1" font-size="12" font-weight="700" letter-spacing="1.55">CONTROL PLANE</text>
    <text x="82" y="519" fill="#e7edf1" font-size="18" font-weight="600">Registry · workflow engine · workers</text>
  </g>

  <g transform="translate(862 62)">
    <rect width="658" height="406" rx="12" fill="url(#panel)" stroke="#2a3846" stroke-width="1.2"/>
    <rect width="658" height="54" rx="12" fill="#131e29"/>
    <path d="M0 54H658" stroke="#2a3846" stroke-width="1"/>
    <circle cx="32" cy="27" r="7" fill="#aa1e2e" filter="url(#softGlow)"/>
    <text x="52" y="32" fill="#f2f5f6" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".45">SYSTEM / EXECUTION STATUS</text>
    <text x="610" y="32" text-anchor="end" fill="#91a2af" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">EQO</text>

    <path d="M90 125H508" fill="none" stroke="#35485a" stroke-width="2"/>
    <path d="M90 204H508" fill="none" stroke="#35485a" stroke-width="2"/>
    <path d="M90 283H508" fill="none" stroke="#35485a" stroke-width="2"/>
    <path d="M117 125V204H278V283H440" fill="none" stroke="#4fa3e3" stroke-opacity=".7" stroke-width="2"/>

    <g font-family="Open Sans, Arial, sans-serif">
      <rect x="44" y="94" width="174" height="62" rx="7" fill="#131e29" stroke="#35485a"/>
      <text x="63" y="120" fill="#91a2af" font-size="11" font-weight="700" letter-spacing="1.3">REPOSITORIES</text>
      <text x="63" y="141" fill="#e7edf1" font-size="15" font-weight="600">Scientific software</text>
      <circle cx="198" cy="110" r="5" fill="#3dbf87"/>

      <rect x="257" y="173" width="174" height="62" rx="7" fill="#131e29" stroke="#4fa3e3" stroke-width="1.4"/>
      <text x="276" y="199" fill="#91a2af" font-size="11" font-weight="700" letter-spacing="1.3">CAPABILITIES</text>
      <text x="276" y="220" fill="#e7edf1" font-size="15" font-weight="600">Pinned &amp; admitted</text>
      <circle cx="411" cy="189" r="5" fill="#4fa3e3"/>

      <rect x="440" y="252" width="174" height="62" rx="7" fill="#131e29" stroke="#35485a"/>
      <text x="459" y="278" fill="#91a2af" font-size="11" font-weight="700" letter-spacing="1.3">EXECUTION</text>
      <text x="459" y="299" fill="#e7edf1" font-size="15" font-weight="600">Local or HPC target</text>
      <circle cx="594" cy="268" r="5" fill="#3dbf87"/>
    </g>

    <g transform="translate(44 342)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="570" height="36" rx="6" fill="#080f16" stroke="#2a3846"/>
      <text x="16" y="23" fill="#8293a1" font-size="12">QHPC</text>
      <text x="88" y="23" fill="#e7edf1" font-size="12">provenance retained across every attempt</text>
      <text x="546" y="23" text-anchor="end" fill="#e46472" font-size="12">● LIVE</text>
    </g>
  </g>
</svg>
