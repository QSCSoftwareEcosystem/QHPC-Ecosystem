api_version: qhpc/v1
kind: Workflow
metadata:
  id: example-generate-and-simulate
  name: Generate and simulate an example circuit
  version: 0.1.0
  owner: hybrid-workflows
  visibility: internal
  description: Illustrative two-node workflow for contract validation.
spec:
  nodes:
    - id: generate
      operation:
        capability: example-toolkit
        version: 0.1.0
        operation: generate
      parameters:
        qubits: 4
    - id: simulate
      operation:
        capability: example-toolkit
        version: 0.1.0
        operation: simulate
      parameters:
        shots: 1024
  edges:
    - from:
        node: generate
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
      to:
        node: simulate
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
  inputs: {}
  outputs:
    results:
      artifact_type: qhpc.measurement-results@1
      from:
        node: simulate
        port: results
