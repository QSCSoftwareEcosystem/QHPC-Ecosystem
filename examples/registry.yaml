        component:
          name: LightStim
          description: Modular QEC framework built on Stim for constructing fault-tolerant circuits and
            protocols, applying noise models, simulating and decoding experiments, and analyzing logical
            performance.
        guidance:
          use_when:
          - Estimate logical error rates from detector-annotated Stim circuits with PyMatching.
          quick_start:
          - Open Compose and choose QEC memory estimation or add Estimate logical error rate.
          - Supply a Stim circuit, review shot and stopping limits, and run on the development Slurm Docker
            target.
          example_workflows:
          - qec-memory-estimation
          - showcase-qec-distance-study
          limitations:
          - EQO currently exposes only logical-error estimation through LightStim's CPU PyMatching simulation
            pipeline; its circuit builders, protocols, additional decoders, GPU support, and visualization
            services are not yet integrated.
          - The verified operation is admitted only on the development Slurm Docker target.
        operations:
        - id: estimate-logical-error
          title: Estimate logical error rate
          description: Sample and decode a detector-annotated Stim circuit with PyMatching.
          inputs:
            circuit:
              artifact_type: qhpc.stim-circuit@1
