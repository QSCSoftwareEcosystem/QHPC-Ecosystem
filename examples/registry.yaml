              title: Maximum sampled shots
              default: 1000
              minimum: 1
              maximum: 100000000
            max_errors:
              type: integer
              title: Logical-error stopping count
              default: 100
              minimum: 1
              maximum: 1000000
            batch_size:
              type: integer
              title: Shots per sampling batch
              default: 1000
              minimum: 1
              maximum: 1000000
            num_workers:
              type: integer
              title: CPU worker processes
              default: 1
              minimum: 1
              maximum: 256
          runtime:
            type: oci
            reference: docker://qhpc/lightstim@sha256:7731c5d9188a4eb5ad8f9448323b60e6ab722786d8f00f9b691d082edf6ec074
