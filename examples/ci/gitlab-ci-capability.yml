# Reference job for project repositories. The validator image and include policy
# must be replaced with the approved internal release before production use.
qhpc-capability-validate:
  image: registry.internal/qsc/qhpc-ecosystem-validator:0.1.0
  stage: test
  script:
    - qhpc-ecosystem contract validate capability qhpc-capability.yaml
  rules:
    - changes:
        - qhpc-capability.yaml
