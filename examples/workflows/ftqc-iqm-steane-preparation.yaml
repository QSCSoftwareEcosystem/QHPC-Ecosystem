api_version: qhpc/v1
kind: Workflow
metadata:
  id: ftqc-iqm-steane-preparation
  name: Prepare one Steane logical qubit for IQM
  version: 0.1.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Expand one Steane logical qubit to seven data-qubit IQM loci without live routing or hardware submission.
spec:
  nodes:
    - id: prepare
      operation:
        capability: ftqc-compiler
        version: 0.2.0
        operation: prepare-iqm
      parameters:
        preparation: steane-logical
        function_name: logical_qubit
  edges: []
  inputs:
    circuit:
      artifact_type: qhpc.quantum-circuit@1
      to:
        node: prepare
        port: circuit
  outputs:
    program:
      artifact_type: qhpc.ftqc-mlir@1
      from:
        node: prepare
        port: program
    iqm_circuit:
      artifact_type: qhpc.iqm-circuit@1
      from:
        node: prepare
        port: circuit
    preparation_report:
      artifact_type: qhpc.ftqc-iqm-preparation-report@1
      from:
        node: prepare
        port: report
