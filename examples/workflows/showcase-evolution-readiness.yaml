api_version: qhpc/v1
kind: Workflow
metadata:
  id: showcase-evolution-readiness
  name: Prepare an evolution circuit for QHPC execution
  version: 0.1.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Synthesize a Pauli Hamiltonian with OpenQEvo, map the circuit with QASMTrans, inspect its structure with STABSim, and count Clifford and T resources with NWQEC.
spec:
  nodes:
    - id: synthesize
      operation:
        capability: openqevo-library
        version: 0.1.0
        operation: synthesize-evolution
      execution_target: local-development
      execution_class: interactive-local
      parameters:
        method: qiskit_trotter
        evolution_time: 1.0
        steps: 4
        order: 2
    - id: transpile
      operation:
        capability: qasmtrans-transpiler
        version: 0.1.0
        operation: transpile
      execution_target: development-slurm-docker
      execution_class: batch-hpc
      parameters:
        mode: ibmq
        backend: ibmq_toronto
    - id: analyze
      operation:
        capability: stabsim-simulator
        version: 0.1.0
        operation: analyze-metrics
      execution_target: development-slurm-docker
      execution_class: batch-hpc
      parameters:
        random_seed: 42
    - id: count
      operation:
        capability: nwqec-qec-transpilation
        version: 0.1.0
        operation: count-clifford-t
      execution_target: development-slurm-docker
      execution_class: batch-hpc
      parameters:
        keep_ccx: false
        rz_error_policy: total
        epsilon: 0.01
  edges:
    - from:
        node: synthesize
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
      to:
        node: transpile
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
    - from:
        node: synthesize
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
      to:
        node: count
        port: circuit
        artifact_type: qhpc.quantum-circuit@1
    - from:
        node: transpile
        port: circuit
        artifact_type: qhpc.transpiled-circuit@1
      to:
        node: analyze
        port: circuit
        artifact_type: qhpc.transpiled-circuit@1
  inputs:
    hamiltonian:
      artifact_type: qhpc.pauli-hamiltonian@1
      to:
        node: synthesize
        port: hamiltonian
  outputs:
    source_circuit:
      artifact_type: qhpc.quantum-circuit@1
      from:
        node: synthesize
        port: circuit
    synthesis_report:
      artifact_type: qhpc.evolution-synthesis-report@1
      from:
        node: synthesize
        port: report
    transpiled_circuit:
      artifact_type: qhpc.transpiled-circuit@1
      from:
        node: transpile
        port: circuit
    circuit_metrics:
      artifact_type: qhpc.circuit-metrics@1
      from:
        node: analyze
        port: metrics
    clifford_t_counts:
      artifact_type: qhpc.clifford-t-counts@1
      from:
        node: count
        port: counts
