api_version: qhpc/v1
kind: Workflow
metadata:
  id: nwqec-counts
  name: Count Clifford and T gates
  version: 0.1.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Execute the portable NWQEC count operation on the virtual Slurm target.
spec:
  nodes:
    - id: count
      operation:
        capability: nwqec-qec-transpilation
        version: 0.1.0
        operation: count-clifford-t
      parameters:
        keep_ccx: false
        rz_error_policy: total
        epsilon: 0.01
  edges: []
  inputs:
    circuit:
      artifact_type: qhpc.quantum-circuit@1
      to:
        node: count
        port: circuit
  outputs:
    counts:
      artifact_type: qhpc.clifford-t-counts@1
      from:
        node: count
        port: counts
