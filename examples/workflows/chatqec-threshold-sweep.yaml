api_version: qhpc/v1
kind: Workflow
metadata:
  id: chatqec-threshold-sweep
  name: Sweep ChatQEC QEC error rates
  version: 0.1.0
  owner: qhpc-ecosystem
  visibility: internal
  description: Run a bounded ChatQEC threshold sweep and retain the empirical rows and sanitized logarithmic SVG plot; the result is not an inferred threshold claim.
spec:
  nodes:
    - id: sweep
      operation:
        capability: chatqec-qec-tools
        version: 0.1.0
        operation: threshold-sweep
      execution_target: development-slurm-docker
      execution_class: batch-hpc
      parameters:
        code_family: repetition_code
        distances: "3,5"
        p_values: "0.001,0.01"
        rounds: 3
        shots: 32
  edges: []
  inputs: {}
  outputs:
    results:
      artifact_type: qhpc.qec-threshold-sweep@1
      from:
        node: sweep
        port: results
    plot:
      artifact_type: qhpc.qec-threshold-plot@1
      from:
        node: sweep
        port: plot
