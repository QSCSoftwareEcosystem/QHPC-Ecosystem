  execution:
    entrypoint: [/opt/qhpc/bin/qhpc-chatqec-lightstim-build]
    working_directory: /work
    network: disabled
    read_only_root: true
    mounts:
      - name: circuit-output
        kind: output
        path: /outputs
        mode: rw
    ports:
      inputs: {}
      outputs:
        circuit: /outputs/circuit.stim
        report: /outputs/build-report.json
    parameters:
      code_family:
        argument: --code-family
        type: string
      distance:
        argument: --distance
        type: integer
      rounds:
        argument: --rounds
        type: integer
      protocol:
        argument: --protocol
        type: string
  verification:
    arguments:
      - --code-family
      - toric_code
      - --distance
      - "3"
      - --rounds
      - "3"
      - --protocol
      - memory
    expected_outputs:
      - path: /outputs/circuit.stim
        nonempty: true
        text_contains:
          - DETECTOR
          - OBSERVABLE_INCLUDE
      - path: /outputs/build-report.json
        nonempty: true
        text_contains:
          - '"schema": "qhpc.qec-circuit-build-report.v1"'
          - '"code_family": "toric_code"'
    timeout_seconds: 120
  release:
    status: unpublished
