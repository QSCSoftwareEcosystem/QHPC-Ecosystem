api_version: qhpc/v1
kind: IntegrationScaffold
metadata:
  id: openqse
  name: OpenQSE
  version: 0.2.0
  project: cross-project
  role: integration-standard
  owners: [openqse]
  visibility: public
  integration_status: published
spec:
  source:
    kind: repository
    url: https://github.com/openQSE/openqse-spec
    catalog_repository: openqse-spec
  mirror:
    status: not-applicable
  development_environment:
    status: assigned
    class: schema-docs
  interfaces: [markdown-source]
  scope:
    status: defined
    summary: Publish the pinned OpenQSE glossary and architecture specification as non-executable ecosystem documentation resources.
  deliverables:
    source_audit: complete
    interface_contract: complete
    adapter: not-applicable
    fixtures: not-applicable
    integration_tests: complete
    registry_publication: complete
  contract_refs:
    - capabilities/openqse-spec/specification/qhpc-capability.yaml
  evidence:
    - docs/evidence/openqse-source-audit-2026-07-24.md
  production_runtime:
    status: not-applicable
    reason: The selected OpenQSE specification is a documentation resource and exposes no executable operation.
  blockers: []
