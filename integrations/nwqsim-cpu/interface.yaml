api_version: qhpc/v1
kind: OperationInterface
metadata:
  id: nwqsim-cpu-simulation
  name: NWQ-Sim CPU State-Vector Simulation
  version: 0.1.0
  component: nwqsim
  project: hybrid-workflows
  owners: [nwqsim]
  source:
    url: https://github.com/pnnl/nwq-sim
    revision: b35763d846e6512ed817d3f88ac8ce79a7e82a7e
  status: contract-valid
  evidence: [docs/evidence/nwqsim-cpu-source-audit-2026-09-16.md]
spec:
  operations:
    - id: simulate-qasm
      title: Simulate bounded OpenQASM with CPU state-vector
      description: Execute a one-register OpenQASM 2.0 circuit through the fixed NWQ-Sim CPU state-vector runner.
      behavior: seeded
      inputs:
        circuit:
          artifact_type: qhpc.quantum-circuit@1
          description: OpenQASM 2.0 circuit with one qreg and at most sixteen qubits.
      outputs:
        measurements:
          artifact_type: qhpc.nwqsim-measurement-counts@1
          description: Seeded CPU state-vector computational-basis shot counts.
      parameters:
        shots:
          type: integer
          default: 1024
          minimum: 1
          maximum: 1000000
        random_seed:
          type: integer
          default: 42
          minimum: 0
          maximum: 2147483647
        max_qubits:
          type: integer
          default: 16
          minimum: 1
          maximum: 16
