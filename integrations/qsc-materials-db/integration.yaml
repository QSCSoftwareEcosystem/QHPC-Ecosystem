api_version: qhpc/v1
kind: IntegrationScaffold
metadata:
  id: qsc-materials-db
  name: QSC Materials Repository
  version: 0.1.0
  project: data-schema
  role: data-service
  owners: [qsc-materials-db]
  visibility: public
  integration_status: published
spec:
  source:
    kind: repository
    url: https://github.com/QSCSoftwareEcosystem/DataSchema
    catalog_repository: DataSchema
  mirror:
    status: not-applicable
  development_environment:
    status: assigned
    class: schema-docs
  interfaces: [json-context, metadata-bundle, markdown-source]
  scope:
    status: defined
    summary: Publish immutable v0.1.0 materials data and schema links with an optional object-storage mirror.
  deliverables:
    source_audit: complete
    interface_contract: complete
    adapter: not-applicable
    fixtures: complete
    integration_tests: complete
    registry_publication: complete
  contract_refs:
    - capabilities/qsc-materials-db/schema/qhpc-capability.yaml
  evidence:
    - capabilities/qsc-materials-db/schema/qhpc-capability.yaml
  production_runtime:
    status: not-applicable
    reason: The admitted record publishes static data and schema resources; object storage is an optional mirror rather than a required runtime.
  blockers: []
