api_version: qhpc/v1
kind: OperationInterface
metadata:
  id: ftqc-compiler
  name: FTQC Fault-Tolerant Compiler
  version: 0.3.0
  component: ftqc
  project: compilation-tools
  owners: [ftqc]
  source:
    url: https://github.com/QSCSoftwareEcosystem/FTQC
    revision: 779216de8805ea0c1d473c640eaf17d6cbfa04e8
  status: contract-valid
  evidence:
    - docs/evidence/ftqc-source-mirror-and-import-smoke-2026-07-29.md
spec:
  operations:
    - id: import-qasm
      title: Import OpenQASM into FTQC MLIR
      description: Run the project-owned standalone OpenQASM 2 or 3 frontend and emit FTQC-dialect MLIR text.
      behavior: deterministic
      inputs:
        circuit:
          artifact_type: qhpc.quantum-circuit@1
          description: UTF-8 OpenQASM 2.0 or 3.0 circuit source.
      outputs:
        program:
          artifact_type: qhpc.ftqc-mlir@1
          description: FTQC-dialect MLIR program at the pinned compiler revision.
      parameters:
        ecc:
          type: string
          title: Error-correcting code
          default: steane
          enum: [steane, surface, color_code]
        distance:
          type: integer
          title: Code distance
          default: 3
          minimum: 1
          maximum: 31
        function_name:
          type: string
          title: MLIR function name
          default: circuit
    - id: prepare-iqm
      title: Prepare an IQM-native circuit
      description: Use the project-owned C API to lower an admitted two-device-qubit or one-Steane-logical-qubit OpenQASM input to FTQC MLIR and IQM JSON without routing or submission.
      behavior: deterministic
      inputs:
        circuit:
          artifact_type: qhpc.quantum-circuit@1
          description: UTF-8 OpenQASM 2.0 or 3.0 circuit source.
      outputs:
        program:
          artifact_type: qhpc.ftqc-mlir@1
        circuit:
          artifact_type: qhpc.iqm-circuit@1
        report:
          artifact_type: qhpc.ftqc-iqm-preparation-report@1
      parameters:
        preparation:
          type: string
          title: Preparation boundary
          default: device
          enum: [device, steane-logical]
        function_name:
          type: string
          title: MLIR and IQM circuit name
          default: circuit
    - id: route-submit-collect
      title: Route and execute a prepared circuit on IQM
      description: Route against the selected device calibration, execute through a credential-isolated quantum-backend worker, and preserve the hardware result packet.
      behavior: stochastic
      inputs:
        circuit:
          artifact_type: qhpc.iqm-circuit@1
        report:
          artifact_type: qhpc.ftqc-iqm-preparation-report@1
      outputs:
        layout:
          artifact_type: qhpc.iqm-routed-layout@1
        receipt:
          artifact_type: qhpc.iqm-job-receipt@1
        counts:
          artifact_type: qhpc.iqm-raw-counts@1
        logical_result:
          artifact_type: qhpc.ftqc-logical-result@1
      parameters:
        device_alias:
          type: string
          title: Worker-admitted IQM device alias
          default: default
        shots:
          type: integer
          title: Measurement shots
          default: 512
          minimum: 1
          maximum: 4096
        credential_reference:
          type: string
          title: Worker-local secret reference
          default: secret://env/IQM_TOKEN
        max_wait_seconds:
          type: integer
          title: Maximum backend wait
          default: 1800
          minimum: 30
          maximum: 7200
