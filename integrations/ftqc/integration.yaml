api_version: qhpc/v1
kind: IntegrationScaffold
metadata:
  id: ftqc
  name: FTQC
  version: 0.3.0
  project: compilation-tools
  role: operation-provider
  owners: [ftqc]
  visibility: internal
  integration_status: published
spec:
  source:
    kind: repository
    url: https://github.com/QSCSoftwareEcosystem/FTQC
    catalog_repository: ftqc
  mirror:
    status: verified
    url: https://code.ornl.gov/qsc-ct/ftqc
  development_environment:
    status: assigned
    class: hpc-build
  interfaces: [qasm, mlir, qir, cli]
  scope:
    status: defined
    summary: Import OpenQASM and prepare constrained IQM-native circuits through the pinned FTQC C API; define a credential-isolated, mock-accepted boundary for later IQM routing and hardware execution.
  deliverables:
    source_audit: complete
    interface_contract: complete
    adapter: complete
    fixtures: complete
    integration_tests: complete
    registry_publication: complete
  contract_refs:
    - capabilities/FTQC/compiler/qhpc-capability.yaml
    - integrations/ftqc/interface.yaml
    - artifact-types/ftqc-mlir-v1.yaml
    - artifact-types/iqm-circuit-v1.yaml
    - artifact-types/ftqc-iqm-preparation-report-v1.yaml
    - artifact-types/iqm-routed-layout-v1.yaml
    - artifact-types/iqm-job-receipt-v1.yaml
    - artifact-types/iqm-raw-counts-v1.yaml
    - artifact-types/ftqc-logical-result-v1.yaml
  evidence:
    - docs/evidence/ftqc-source-mirror-and-import-smoke-2026-07-29.md
    - docs/evidence/ftqc-local-iqm-preparation-smoke-2026-09-03.md
    - docs/evidence/ftqc-iqm-mock-backend-2026-09-04.md
  production_runtime:
    status: deferred
    technology: apptainer
    reason: A macOS arm64 development runtime is locally verified, but the production LLVM/MLIR 22 Linux runtime remains deferred pending license clearance and target acceptance.
  blockers:
    - Add explicit distributable license terms before publishing FTQC binaries or images.
    - Pin and reproduce the LLVM/MLIR 22 toolchain and execute the upstream lit suite for a portable Linux runtime.
    - Preserve a developer-approved IQM hardware run receipt, exact device identity, generated-circuit digest, physical layout, raw counts, and corrected logical result before promoting the one-logical-qubit demonstration to verified evidence.
    - Publish immutable OCI and SIF artifacts with supply-chain and target acceptance evidence.
