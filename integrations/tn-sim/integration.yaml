api_version: qhpc/v1
kind: IntegrationScaffold
metadata:
  id: tn-sim
  name: TN-Sim
  version: 0.1.0
  project: hybrid-workflows
  role: operation-provider
  owners: [tn-sim]
  visibility: public
  integration_status: published
spec:
  source:
    kind: repository
    url: https://github.com/pnnl/NWQ-Sim/tree/tn_sim
    catalog_repository: NWQ-Sim
  mirror:
    status: not-applicable
  development_environment:
    status: assigned
    class: hpc-build
  interfaces: [qasm, cli]
  scope:
    status: defined
    summary: Run seeded OpenQASM 2.0 shot simulation through the CPU iTensor MPS path and return structured measurement counts.
  deliverables:
    source_audit: complete
    interface_contract: complete
    adapter: complete
    fixtures: complete
    integration_tests: complete
    registry_publication: complete
  contract_refs:
    - capabilities/NWQ-Sim/tn-sim/qhpc-capability.yaml
    - integrations/tn-sim/interface.yaml
  evidence:
    - docs/evidence/initial-component-source-audit-2026-07-22.md
    - docs/evidence/tn-sim-source-audit-2026-07-24.md
  production_runtime:
    status: deferred
    technology: apptainer
    reason: Build and accept the exact-revision iTensor runtime after the adapter contract and fixtures stabilize.
  blockers:
    - Build the exact revision with pinned iTensor, C++17, and BLAS/LAPACK dependencies in a reproducible Linux runtime.
    - Correct or overlay the branch's site-specific build assumptions and execute source-backed correctness fixtures.
    - Keep TAMM CPU and GPU backends deferred until their MPI, accelerator, scaling, and target evidence is accepted.
