api_version: qhpc/v1
kind: IntegrationScaffold
metadata:
  id: chatqec
  name: ChatQEC
  version: 0.3.1
  project: agentic-software
  role: assistant-service
  owners: [chatqec]
  visibility: internal
  integration_status: published
spec:
  source:
    kind: repository
    url: https://github.com/QSCSoftwareThrust/ChatQEC
    catalog_repository: chatqec
  mirror:
    status: verified
    url: https://code.ornl.gov/qsc-as/chatqec
  development_environment:
    status: assigned
    class: agentic
  interfaces: [python-api, cli, streamlit, https-json, sse]
  scope:
    status: defined
    summary: Expose authenticated cited text answers over a versioned read-only corpus through a separate internal service, without embedding ChatQEC or its model credentials into the Workbench or QHPC API process.
  deliverables:
    source_audit: complete
    interface_contract: complete
    adapter: complete
    fixtures: complete
    integration_tests: complete
    registry_publication: complete
  contract_refs:
    - capabilities/ChatQEC/service/qhpc-capability.yaml
    - integrations/chatqec/service.yaml
  evidence:
    - docs/evidence/initial-component-source-audit-2026-07-22.md
    - docs/adr/0008-chatqec-internal-service-boundary.md
    - docs/chatqec-service-boundary.md
    - docs/chatqec-api-handoff.md
    - docs/evidence/chatqec-local-service-smoke-2026-07-28.md
    - docs/evidence/chatqec-bundled-corpus-2026-09-03.md
  production_runtime:
    status: deferred
    technology: oci
    reason: Service containerization follows implementation and acceptance of the model-backed production service and selection of approved deployment dependencies.
  blockers:
    - Select and obtain institutional acceptance for the concrete model and embedding endpoints, allowed content and egress, retention settings, and workload identity mechanism.
    - Refresh or retire the stale QSCSoftware/chatqec GitLab copy without overwriting the GitHub working source.
