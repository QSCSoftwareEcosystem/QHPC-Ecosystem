[project]
name = "qhpc-ecosystem"
version = "0.1.0"
description = "Contract-first orchestration and runtime integration for the QSC quantum-HPC ecosystem."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QSC Software Thrust" }]
keywords = ["apptainer", "hpc", "quantum-computing", "containers"]
dependencies = [
    "jsonschema>=4.19",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "setuptools>=68", "wheel>=0.41", "Django>=5.2.15,<5.3"]
local = ["Django>=5.2.15,<5.3"]
workbench = ["Django>=5.2.15,<5.3"]

[project.scripts]
eqo = "qhpc_ecosystem.cli:main"
qhpc-ecosystem = "qhpc_ecosystem.cli:main"
qhpc-workbench = "qhpc_workbench.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qhpc_ecosystem*", "qhpc_workbench*"]

[tool.setuptools.package-data]
qhpc_ecosystem = ["contracts/*.json", "openqevo_context/*.json", "workbench/*.html", "workbench/*.css", "workbench/*.js", "workbench/assets/*"]
"qhpc_ecosystem.local_assets" = [
    "*.yaml",
    "catalog/*.tsv",
    "workflows/*.yaml",
    "chatqec/LICENSE",
    "chatqec/SOURCE.json",
    "chatqec/knowledge/canonical/*.md",
]
qhpc_workbench = ["templates/qhpc_workbench/*.html", "static/qhpc_workbench/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
