schema_version: 1
catalog_updated: "2026-07-22"
source_manifest: ../ProjectManagement/gitlab-mirror/repositories.tsv

environments:
  python-lib:
    recipe: containers/base-python.def
    description: Python libraries, frameworks, and lightweight simulators.
  hpc-build:
    recipe: containers/base-hpc.def
    description: Compilers, native extensions, MPI, and HPC-oriented simulation.
  schema-docs:
    recipe: containers/base-docs.def
    description: Schemas, documentation, catalogs, and knowledge tooling.
  agentic:
    recipe: containers/base-agentic.def
    description: Python and Node.js environment for agents, RAG, and dashboards.
  packaging:
    recipe: containers/base-packaging.def
    description: Spack repository development and HPC package maintenance.

