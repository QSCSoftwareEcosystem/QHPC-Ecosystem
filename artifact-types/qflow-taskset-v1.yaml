api_version: qhpc/v1
kind: ArtifactType
metadata:
  id: qhpc.qflow-taskset
  name: QFlow Cycle Task Set
  version: 1
  project: hybrid-workflows
  owners: [exachem-qflow, iris-qiris, qhpc-ecosystem]
  status: draft
spec:
  description: A complete QFlow cycle of independent formed-Hamiltonian tasks sharing one immutable amplitude snapshot.
  media_type: application/vnd.qsc.qflow-taskset+json
  representation: json
  extensions: [json]
  json_schema:
    type: object
    additionalProperties: false
    required:
      - schema
      - producer
      - task_set_id
      - workflow
      - amplitude_state
      - task_generation
      - execution_policy
      - tasks
      - result_contract
    properties:
      schema:
        const: qflow.qiris.taskset.v1
      producer:
        const: qflow
      task_set_id:
        type: string
        minLength: 1
      workflow:
        type: object
        additionalProperties: false
        required: [name, run_id, cycle_id, max_cycles, dependency_model]
        properties:
          name:
            const: qflow
          run_id:
            type: string
            minLength: 1
          cycle_id:
            type: integer
            minimum: 1
          max_cycles:
            type: integer
            minimum: 1
          dependency_model:
            const: cycle_barrier
      amplitude_state:
        type: object
        additionalProperties: false
        required: [snapshot_id, t1_reference, t2_reference, update_policy]
        properties:
          snapshot_id:
            type: string
            minLength: 1
          t1_reference:
            type: [string, "null"]
          t2_reference:
            type: [string, "null"]
          update_policy:
            const: qflow_after_cycle
      task_generation:
        type: object
        additionalProperties: false
        required:
          - n_combinations
          - nactive_oa
          - nactive_ob
          - nactive_va
          - nactive_vb
          - ducc_level
          - qflow_threshold
        properties:
          n_combinations:
            type: integer
            minimum: 1
          nactive_oa:
            type: integer
            minimum: 0
          nactive_ob:
            type: integer
            minimum: 0
          nactive_va:
            type: integer
            minimum: 0
          nactive_vb:
            type: integer
            minimum: 0
          ducc_level:
            type: integer
            minimum: 1
          qflow_threshold:
            type: number
            minimum: 0
      execution_policy:
        type: object
        additionalProperties: false
        required:
          - scheduler
          - target_policy
          - fallback_policy
          - max_concurrency
          - allowed_backends
        properties:
          scheduler:
            const: qiris
          target_policy:
            type: string
            minLength: 1
          fallback_policy:
            enum: [fail, retry_then_fail]
          max_concurrency:
            type: [integer, "null"]
            minimum: 1
          allowed_backends:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
      tasks:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - schema
            - task_id
            - task_index
            - source
            - active_space
            - problem
            - solver
            - ordering
            - execution
          properties:
            schema:
              const: qflow.qiris.task.v1
            task_id:
              type: string
              minLength: 1
            task_index:
              type: integer
              minimum: 1
            source:
              type: object
            active_space:
              type: object
            amplitude_snapshot_id:
              type: string
              minLength: 1
            problem:
              type: object
              required: [representation, n_particles, n_qubits, hamiltonian, hamiltonian_format]
              properties:
                representation:
                  const: formed_hamiltonian
                n_particles:
                  type: integer
                  minimum: 1
                n_qubits:
                  type: integer
                  minimum: 1
                hamiltonian:
                  type: array
                  minItems: 1
                hamiltonian_format:
                  type: string
                  minLength: 1
            solver:
              type: object
            ordering:
              type: object
            execution:
              type: object
      result_contract:
        type: object
        additionalProperties: false
        required: [schema, task_result_schema, ordering_required, provenance_required]
        properties:
          schema:
            const: qflow.qiris.taskset_result.v1
          task_result_schema:
            const: qflow.qiris.result.v1
          ordering_required:
            const: true
          provenance_required:
            const: true
  compatibility:
    accepts_versions: [1]
