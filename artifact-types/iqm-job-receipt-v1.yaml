api_version: qhpc/v1
kind: ArtifactType
metadata:
  id: qhpc.iqm-job-receipt
  name: IQM Job Receipt
  version: 1
  project: cross-project
  owners: [qhpc-ecosystem]
  status: draft
spec:
  description: Non-secret receipt that binds an IQM job to its device, calibration, shots, routed layout, and timestamps.
  media_type: application/vnd.qsc.iqm-job-receipt+json
  representation: json
  extensions: [json]
  json_schema:
    type: object
    additionalProperties: false
    required:
      - schema
      - job_id
      - device
      - shots
      - submitted_at
      - completed_at
      - terminal_state
      - routed_layout_checksum
    properties:
      schema:
        const: qhpc.iqm-job-receipt.v1
      job_id:
        type: string
        minLength: 1
        maxLength: 128
      device:
        $ref: "#/$defs/device"
      shots:
        type: integer
        minimum: 1
        maximum: 4096
      submitted_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
      terminal_state:
        const: succeeded
      routed_layout_checksum:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
    $defs:
      device:
        type: object
        additionalProperties: false
        required: [provider, alias, quantum_computer_id, calibration_id]
        properties:
          provider:
            const: iqm
          alias:
            type: string
            minLength: 1
          quantum_computer_id:
            type: string
            minLength: 1
          calibration_id:
            type: string
            minLength: 1
  compatibility:
    accepts_versions: [1]
