api_version: qhpc/v1
kind: ArtifactType
metadata:
  id: qhpc.glcb-circuit-spec
  name: Gemini Logical Circuit Builder Circuit Specification
  version: 1
  project: cross-project
  owners: [qhpc-ecosystem]
  status: draft
spec:
  description: Bounded JSON circuit specification for deterministic Gemini Logical Circuit Builder URL construction. It is not transmitted by the EQO operation.
  media_type: application/vnd.qsc.glcb-circuit-spec+json
  representation: json
  extensions: [json]
  json_schema:
    type: object
    additionalProperties: false
    required: [qubits, gates]
    properties:
      qubits:
        type: integer
        minimum: 1
        maximum: 64
      gates:
        type: array
        maxItems: 200
        items:
          type: object
          additionalProperties: false
          required: [gate, column, targets]
          properties:
            gate:
              type: string
              pattern: "^[A-Za-z0-9_]+$"
            column:
              type: integer
              minimum: 0
            targets:
              type: array
              minItems: 1
              items:
                type: integer
                minimum: 0
      prep:
        type: array
        maxItems: 200
      postselect:
        type: array
        maxItems: 200
      gadgets:
        type: array
        maxItems: 200
      placement:
        type: array
        maxItems: 200
      sampler:
        const: clifft
  compatibility:
    accepts_versions: [1]
