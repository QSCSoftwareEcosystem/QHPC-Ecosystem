api_version: qhpc/v1
kind: ArtifactType
metadata:
  id: qhpc.ftqc-iqm-preparation-report
  name: FTQC IQM Preparation Report
  version: 1
  project: compilation-tools
  owners: [ftqc, qhpc-ecosystem]
  status: draft
spec:
  description: Provenance, circuit width, gate counts, and explicit routing and submission boundaries for a credential-free FTQC IQM preparation.
  media_type: application/vnd.qsc.ftqc-iqm-preparation-report+json
  representation: json
  extensions: [json]
  json_schema:
    type: object
    additionalProperties: false
    required:
      - schema
      - preparation
      - compiler_interface
      - source_revision
      - ecc
      - logical_qubits
      - device_qubits
      - instruction_count
      - gate_counts
      - loci
      - angle_units
      - routing
      - submission
      - claim_boundary
    properties:
      schema:
        const: qhpc.ftqc-iqm-preparation-report.v1
      preparation:
        enum: [device, steane-logical]
      compiler_interface:
        const: ftqc_qasm_opt
      source_revision:
        type: string
        pattern: "^[0-9a-f]{40}$"
      ecc:
        type: object
        additionalProperties: false
        required: [kind, distance]
        properties:
          kind:
            const: steane
          distance:
            const: 3
      logical_qubits:
        type: [integer, "null"]
        minimum: 1
      device_qubits:
        type: integer
        minimum: 1
      instruction_count:
        type: integer
        minimum: 1
      gate_counts:
        type: object
        additionalProperties:
          type: integer
          minimum: 1
      loci:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^QB[1-9][0-9]*$"
      angle_units:
        const: radians
      routing:
        type: object
        additionalProperties: false
        required: [status, requirement, reason]
        properties:
          status:
            const: not-performed
          requirement:
            enum: [calibration-check-required, required-before-hardware]
          reason:
            type: string
            minLength: 1
      submission:
        type: object
        additionalProperties: false
        required: [status, execution_class]
        properties:
          status:
            const: not-submitted
          execution_class:
            const: quantum-backend
      claim_boundary:
        type: string
        minLength: 1
  compatibility:
    accepts_versions: [1]
