api_version: qhpc/v1
kind: ArtifactType
metadata:
  id: qhpc.qec-threshold-sweep
  name: QEC Threshold Sweep Evidence
  version: 1
  project: cross-project
  owners: [qhpc-ecosystem]
  status: draft
spec:
  description: Empirical bounded QEC sweep rows. This artifact records observations; it does not assert an estimated threshold.
  media_type: application/vnd.qsc.qec-threshold-sweep+json
  representation: json
  extensions: [json]
  json_schema:
    type: object
    additionalProperties: false
    required: [schema, code_family, distances, p_values, rounds, shots, rows]
    properties:
      schema:
        const: qhpc.qec-threshold-sweep.v1
      code_family:
        enum: [surface_code_rotated, repetition_code, color_code]
      distances:
        type: array
        minItems: 1
        maxItems: 5
        items:
          type: integer
          minimum: 3
          maximum: 15
      p_values:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: number
          exclusiveMinimum: 0
          maximum: 0.5
      rounds:
        type: [integer, "null"]
        minimum: 1
        maximum: 200
      shots:
        type: integer
        minimum: 1
        maximum: 1000000
      rows:
        type: array
        minItems: 1
        maxItems: 60
        items:
          type: object
          additionalProperties: false
          required: [distance, p, shots, logical_error_rate]
          properties:
            distance:
              type: integer
            p:
              type: number
            shots:
              type: integer
            logical_error_rate:
              type: number
              minimum: 0
              maximum: 1
  compatibility:
    accepts_versions: [1]
